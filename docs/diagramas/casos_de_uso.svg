<text x="72" y="1300" font-size="14" text-anchor="start" fill="#1A1A1A">generalización: el Administrador hereda los casos de uso</text>
<text x="72" y="1318" font-size="14" text-anchor="start" fill="#1A1A1A">del Personal FEDER (CU2–CU8) y además administra CU1</text>
<path d="M1500 1000 L1774 1000 L1786 1012 L1786 1214 L1500 1214 Z" fill="#FBFBF6" stroke="#9A9A9A" stroke-width="1.2"/>
<path d="M1774 1000 L1774 1012 L1786 1012" fill="none" stroke="#9A9A9A" stroke-width="1.2"/>
<text x="1510" y="1022" font-size="14" font-weight="bold" text-anchor="start" fill="#1A1A1A">Alcance de cada actor</text>
<text x="1510" y="1040" font-size="14" text-anchor="start" fill="#1A1A1A">Personal FEDER: CU2–CU8</text>
<text x="1510" y="1058" font-size="14" text-anchor="start" fill="#1A1A1A">(operación diaria).</text>
<text x="1510" y="1076" font-size="14" text-anchor="start" fill="#1A1A1A">Productor: su perfil (CU2),</text>
<text x="1510" y="1094" font-size="14" text-anchor="start" fill="#1A1A1A">producción y lotes (CU3) y</text>
<text x="1510" y="1112" font-size="14" text-anchor="start" fill="#1A1A1A">consulta de sus ventas a</text>
<text x="1510" y="1130" font-size="14" text-anchor="start" fill="#1A1A1A">FEDER (CU4).</text>
<text x="1510" y="1148" font-size="14" text-anchor="start" fill="#1A1A1A">Cliente: su cuenta (CU1), CU5</text>
<text x="1510" y="1166" font-size="14" text-anchor="start" fill="#1A1A1A">y sus pedidos/pagos (CU6).</text>
<text x="1510" y="1184" font-size="14" text-anchor="start" fill="#1A1A1A">Visitante: catálogo público y</text>
<text x="1510" y="1202" font-size="14" text-anchor="start" fill="#1A1A1A">registro como cliente.</text>

<text x="640" y="277.7" font-size="15" text-anchor="middle" fill="#1A1A1A">Gestión de Usuarios</text>
<ellipse cx="610" cy="640" rx="190" ry="62" fill="#EAF0F6" stroke="#1F4E79" stroke-width="1.6"/><text x="610" y="627.1" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F4E79">CU5</text>
<text x="610" y="646.2" font-size="15" text-anchor="middle" fill="#1A1A1A">Gestión de Comercio Electrónico, Carrito de</text>
<text x="610" y="665.2" font-size="15" text-anchor="middle" fill="#1A1A1A">Compras, Ventas Inmediatas y Encargos</text>
<ellipse cx="480" cy="920" rx="190" ry="62" fill="#EAF0F6" stroke="#1F4E79" stroke-width="1.6"/><text x="480" y="897.6" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F4E79">CU6</text>
<text x="480" y="916.7" font-size="15" text-anchor="middle" fill="#1A1A1A">Gestión de Procesar Pedidos, Pagos</text>
<text x="480" y="935.7" font-size="15" text-anchor="middle" fill="#1A1A1A">Multicanal, Entregas y Notificaciones al</text>
<text x="480" y="954.7" font-size="15" text-anchor="middle" fill="#1A1A1A">Cliente</text>
<ellipse cx="520" cy="1150" rx="190" ry="62" fill="#EAF0F6" stroke="#1F4E79" stroke-width="1.6"/><text x="520" y="1146.6" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F4E79">CU7</text>
<text x="520" y="1165.7" font-size="15" text-anchor="middle" fill="#1A1A1A">Gestión de Indicadores Financieros</text>
<ellipse cx="990" cy="470" rx="190" ry="62" fill="#EAF0F6" stroke="#1F4E79" stroke-width="1.6"/><text x="990" y="457.1" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F4E79">CU4</text>
<text x="990" y="476.2" font-size="15" text-anchor="middle" fill="#1A1A1A">Gestión de Catálogo Unificado, Inventarios,</text>
<text x="990" y="495.2" font-size="15" text-anchor="middle" fill="#1A1A1A">Alertas y Control de Concurrencia</text>
<ellipse cx="1190" cy="700" rx="190" ry="62" fill="#EAF0F6" stroke="#1F4E79" stroke-width="1.6"/><text x="1190" y="687.1" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F4E79">CU3</text>
<text x="1190" y="706.2" font-size="15" text-anchor="middle" fill="#1A1A1A">Gestión de Producción Agrícola, Asignar</text>
<text x="1190" y="725.2" font-size="15" text-anchor="middle" fill="#1A1A1A">Lotes y Controlar Trazabilidad de Origen</text>
<ellipse cx="1280" cy="960" rx="190" ry="62" fill="#EAF0F6" stroke="#1F4E79" stroke-width="1.6"/><text x="1280" y="947.1" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F4E79">CU2</text>
<text x="1280" y="966.2" font-size="15" text-anchor="middle" fill="#1A1A1A">Gestión de Productores y Comunidades</text>
<text x="1280" y="985.2" font-size="15" text-anchor="middle" fill="#1A1A1A">Agrícolas</text>
<ellipse cx="1270" cy="1170" rx="190" ry="62" fill="#EAF0F6" stroke="#1F4E79" stroke-width="1.6"/><text x="1270" y="1166.6" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F4E79">CU8</text>
<text x="1270" y="1185.7" font-size="15" text-anchor="middle" fill="#1A1A1A">Reportes y Estadísticas</text>

</defs>
<rect x="0" y="0" width="1800" height="1440" fill="#FFFFFF"/>
<text x="40" y="50" font-size="28" font-weight="bold" text-anchor="start" fill="#1F4E79">Diagrama de casos de uso — Sistema FEDER (Email-Driven)</text>
<text x="40" y="80" font-size="17" text-anchor="start" fill="#5A5A5A">Cuatro roles de negocio (ADMINISTRADOR, PERSONAL_FEDER, PRODUCTOR, CLIENTE) y el visitante sin cuenta, que solo usa comandos públicos</text>

<g class="leyenda" transform="translate(900 640)">
<rect x="0" y="0" width="430" height="136" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1"/>
<text x="12" y="21" font-size="12.5" font-weight="bold" fill="#1F4E79">Notación (pata de gallo)</text>
<line x1="16" y1="44" x2="74" y2="44" stroke="#3A3A3A" stroke-width="1.3"/>
<line x1="74" y1="35" x2="74" y2="53" stroke="#4A4A4A" stroke-width="2"/>
<g stroke="#3A3A3A" stroke-width="1.3"><line x1="66" y1="50.5" x2="66" y2="37.5"/><line x1="60" y1="50.5" x2="60" y2="37.5"/></g>
<text x="90" y="48" font-size="11.5" fill="#1A1A1A">uno y solo uno (FK NOT NULL)</text>
<line x1="16" y1="68" x2="74" y2="68" stroke="#3A3A3A" stroke-width="1.3"/>
<line x1="74" y1="59" x2="74" y2="77" stroke="#4A4A4A" stroke-width="2"/>
<g stroke="#3A3A3A" stroke-width="1.3"><line x1="65" y1="74.5" x2="65" y2="61.5"/><circle cx="54" cy="68" r="4.2" fill="#FFFFFF"/></g>
<text x="90" y="72" font-size="11.5" fill="#1A1A1A">cero o uno (FK opcional o FK UNIQUE)</text>
<line x1="16" y1="92" x2="74" y2="92" stroke="#3A3A3A" stroke-width="1.3"/>
<line x1="74" y1="83" x2="74" y2="101" stroke="#4A4A4A" stroke-width="2"/>
<g stroke="#3A3A3A" stroke-width="1.3"><line x1="61" y1="92" x2="74" y2="99"/><line x1="61" y1="92" x2="74" y2="85"/><circle cx="54" cy="92" r="4.2" fill="#FFFFFF"/></g>
<text x="90" y="96" font-size="11.5" fill="#1A1A1A">cero o muchos (lado de la FK)</text>
<text x="16" y="120" font-size="11.5" fill="#1A1A1A" xml:space="preserve"><tspan font-weight="bold" fill="#1F4E79">PK</tspan> clave primaria   <tspan font-weight="bold" fill="#1F4E79">FK</tspan> clave foránea   <tspan font-weight="bold" fill="#1F4E79">UQ</tspan> valor único   <tspan font-weight="bold">negrita</tspan> = NOT NULL</text>
</g>
<g class="notas">
<rect x="900" y="290" width="460" height="230" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1"/>
<text x="912" y="311" font-size="12.5" font-weight="bold" fill="#1F4E79">Restricciones de integridad adicionales</text>
<text x="912" y="330" font-size="11" fill="#1A1A1A" font-weight="bold" xml:space="preserve">usuario.uq_usuario_ci</text>
<text x="912" y="345.5" font-size="11" fill="#5A5A5A" xml:space="preserve">UNIQUE (ci, COALESCE(ci_complemento, ''))</text>
<text x="912" y="361" font-size="11" fill="#1A1A1A" font-weight="bold" xml:space="preserve">usuario.uq_usuario_correo</text>
<text x="912" y="376.5" font-size="11" fill="#5A5A5A" xml:space="preserve">UNIQUE (lower(correo))</text>
<text x="912" y="392" font-size="11" fill="#1A1A1A" font-weight="bold" xml:space="preserve">usuario_rol.uq_usuario_rol_concesion_abierta</text>
<text x="912" y="407.5" font-size="11" fill="#5A5A5A" xml:space="preserve">UNIQUE (usuario_id, rol_id) WHERE (estado IN ('PENDIENTE', 'VIGENTE'))</text>
<text x="912" y="423" font-size="11" fill="#1A1A1A" font-weight="bold" xml:space="preserve">bitacora.uq_bitacora_clave_operacion</text>
<text x="912" y="438.5" font-size="11" fill="#5A5A5A" xml:space="preserve">UNIQUE ((detalle-&gt;&gt;'clave_operacion')) WHERE (entidad = 'DETALLE_COMPRA')</text>
<text x="912" y="454" font-size="11" fill="#1A1A1A" font-weight="bold" xml:space="preserve">bitacora.uq_bitacora_documento_entrega</text>
<text x="912" y="469.5" font-size="11" fill="#5A5A5A" xml:space="preserve">UNIQUE ((detalle-&gt;&gt;'compra_id'), entidad_id, (detalle-&gt;&gt;'documento_entrega')) WHERE</text>
<text x="912" y="485" font-size="11" fill="#5A5A5A" xml:space="preserve">    ((entidad = 'DETALLE_COMPRA') AND ((detalle-&gt;&gt;'operacion') = 'RECEPCION') AND</text>
<text x="912" y="500.5" font-size="11" fill="#5A5A5A" xml:space="preserve">    (detalle ? 'documento_entrega'))</text>
</g>
<g class="notas">
<rect x="60" y="500" width="380" height="120" fill="#FAFBFC" stroke="#9AA5B1" stroke-width="1"/>
<text x="72" y="521" font-size="12.5" font-weight="bold" fill="#1F4E79">Referencias desde otros módulos (no dibujadas)</text>
<text x="72" y="540" font-size="11" fill="#1A1A1A" font-weight="bold" xml:space="preserve">usuario ←</text>
<text x="72" y="555.5" font-size="11" fill="#5A5A5A" xml:space="preserve">confirmacion_operacion.usuario_id (INFRA), historial_pedido.usuario_id</text>
<text x="72" y="571" font-size="11" fill="#5A5A5A" xml:space="preserve">    (CU5), item_carrito.cliente_id (CU5),</text>
<text x="72" y="586.5" font-size="11" fill="#5A5A5A" xml:space="preserve">    movimiento_inventario.usuario_id (CU4), notificacion.usuario_id</text>
<text x="72" y="602" font-size="11" fill="#5A5A5A" xml:space="preserve">    (CU6), pedido.usuario_id (CU5), productor.usuario_id (CU2-CU3)</text>
</g>
</svg>

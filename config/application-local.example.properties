# Entorno LOCAL (APP_ENV=local)
# Copie este archivo como config/application-local.properties (excluido de Git) y ajuste lo necesario.
# La aplicación usa el PostgreSQL instalado en Windows (servicio del sistema, puerto 5432) y el servidor de
# correo local de demostración (scripts/correo-local.ps1). No contiene secretos.
# Las pruebas automáticas NO usan esta base: usan el clúster del proyecto (scripts/pg-local.ps1, puerto 55432,
# base feder_test).

db.url=jdbc:postgresql://127.0.0.1:5432/feder_local
db.username=postgres
# Escriba aquí la contraseña de su PostgreSQL (solo en la copia privada config/application-local.properties).
db.password=

# Buzón del sistema en el servidor de correo local
# En el servidor local el usuario POP3/SMTP es la dirección completa del buzón.
mail.username=grupo29sa@feder.local
mail.from=grupo29sa@feder.local
mail.pop3.host=127.0.0.1
mail.pop3.port=1110
mail.pop3.security=NINGUNO
mail.smtp.host=127.0.0.1
mail.smtp.port=2525
mail.smtp.security=NINGUNO
mail.smtp.auth=PLAIN
# Solo el entorno local permite credenciales sin cifrar (servidor en 127.0.0.1).
mail.permitir.texto.plano=true
# Contraseña del buzón local de demostración (no es una credencial real).
mail.password=buzon-local

procesamiento.intervalo.segundos=5
procesamiento.max.mensajes.por.ciclo=20
seguridad.confirmacion.minutos=30
seguridad.limite.solicitudes.por.hora=30
logs.dir=logs

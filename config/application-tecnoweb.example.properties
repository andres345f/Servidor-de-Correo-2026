# Entorno TECNOWEB (APP_ENV=tecnoweb) - infraestructura institucional del grupo 29SA.
# Copie este archivo como config/application-tecnoweb.properties (excluido de Git).
# Las contraseñas NO se escriben aquí: defínalas como variables de entorno DB_PASSWORD y MAIL_PASSWORD.
#
# IMPORTANTE: los puertos y el modo de cifrado deben confirmarse antes de usar el entorno
# (ejecute: .\scripts\diagnostico-tecnoweb.ps1). No se asume que 110/25 funcionen.

db.url=jdbc:postgresql://db.tecnoweb.org.bo:5432/db_grupo29sa
db.username=grupo29sa

mail.username=grupo29sa
mail.from=grupo29sa@tecnoweb.org.bo
mail.pop3.host=mail.tecnoweb.org.bo
# 995 = POP3 con TLS implícito (TLS); 110 con STLS (STARTTLS). Confirmar con el diagnóstico.
mail.pop3.port=995
mail.pop3.security=TLS
mail.smtp.host=mail.tecnoweb.org.bo
# 587 = envío con STARTTLS y autenticación; 465 = TLS implícito. Confirmar con el diagnóstico.
mail.smtp.port=587
mail.smtp.security=STARTTLS
mail.smtp.auth=PLAIN
mail.permitir.texto.plano=false

procesamiento.intervalo.segundos=5
procesamiento.max.mensajes.por.ciclo=20
seguridad.confirmacion.minutos=30
seguridad.limite.solicitudes.por.hora=30
logs.dir=logs

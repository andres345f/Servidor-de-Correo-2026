# Entorno TECNOWEB (APP_ENV=tecnoweb) - infraestructura institucional del grupo 29SA.
# Copie este archivo como config/application-tecnoweb.properties (excluido de Git).
# Las contraseñas NO se escriben aquí: defínalas como variables de entorno DB_PASSWORD y MAIL_PASSWORD,
# o solo en la copia privada config/application-tecnoweb.properties.
#
# Puertos confirmados con .\scripts\diagnostico-tecnoweb.ps1 (noviembre 2026):
#   - POP3: solo 110, sin STLS (995 cerrado).
#   - SMTP: solo 25, sin STARTTLS (587/465 cerrados); acepta envíos sin autenticar
#     (solo anuncia AUTH CRAM-MD5, que el cliente no implementa).
# Por eso este entorno necesita mail.permitir.texto.plano=true: la contraseña POP3 viaja sin cifrar.

db.url=jdbc:postgresql://db.tecnoweb.org.bo:5432/db_grupo29sa
db.username=grupo29sa

mail.username=grupo29sa
mail.from=grupo29sa@tecnoweb.org.bo
mail.pop3.host=mail.tecnoweb.org.bo
mail.pop3.port=110
mail.pop3.security=NINGUNO
mail.smtp.host=mail.tecnoweb.org.bo
mail.smtp.port=25
mail.smtp.security=NINGUNO
mail.smtp.auth=NINGUNA
mail.permitir.texto.plano=true

procesamiento.intervalo.segundos=5
procesamiento.max.mensajes.por.ciclo=20
seguridad.confirmacion.minutos=30
seguridad.limite.solicitudes.por.hora=30
logs.dir=logs

# ---------------------------------------------------------------------------------------------------
# PagoFácil (pagos QR). Sin pagofacil.token.servicio se usa la pasarela local (el personal confirma con CONPAG).
# Los tokens van SOLO en la copia privada config/application-tecnoweb.properties.
# Después de configurarlos, ejecute: java -jar target\feder-email-driven.jar diagnostico-pagofacil
# (no genera QR): muestra los paymentMethodId habilitados y qué valor de paymentStatus significa "pagado".
#pagofacil.url=https://masterqr.pagofacil.com.bo/api/services/v2
#pagofacil.token.servicio=
#pagofacil.token.secreto=
# paymentMethodId que se usa al generar el QR (de /list-enabled-services).
#pagofacil.metodo.pago=
# Valor de paymentStatus que significa "pagado". Mientras falte, NO se confirma ningún pago automáticamente.
#pagofacil.estado.pagado=
# Cada cuántos segundos se consultan los pagos QR pendientes (/query-transaction). No hace falta callback.
#pagofacil.consulta.segundos=60
